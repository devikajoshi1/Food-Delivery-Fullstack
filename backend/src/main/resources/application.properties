spring.application.name=food-delivery

# Database: the real values come from environment variables when deployed
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_delivery}
spring.datasource.username=${DB_USERNAME:food_app}
spring.datasource.password=${DB_PASSWORD}

# Local secrets (like DB_PASSWORD) live in secrets.properties, which git ignores
spring.config.import=optional:classpath:secrets.properties

# Flyway owns the schema; Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate

# Print the SQL Hibernate runs (handy while learning, turn off later)
spring.jpa.show-sql=true
spring.jpa.open-in-view= false

#signs and checks every JWT . the value lives in secrets.properties
jwt.secret=${JWT_SECRET}